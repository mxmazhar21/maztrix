<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0B">
  <title>Maztrix</title>
  <!-- PWA : installation sur l'écran d'accueil de l'iPhone -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maztrix">
  <link rel="preload" href="assets/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="barre-haut">
    <span class="logo" aria-hidden="true">M</span>
    <span class="marque">Maztrix</span>
    <button class="icone" data-onglet="reglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>
      </svg>
    </button>
  </header>

  <main id="vue"></main>

  <nav class="onglets">
    <button data-onglet="seance">Séance</button>
    <button data-onglet="programme">Programme</button>
    <button data-onglet="chrono">Chrono</button>
    <button data-onglet="progres">Progrès</button>
  </nav>

  <!-- Page de présentation : glisser la poignée jusqu'au bout pour ouvrir l'app -->
  <div id="intro" class="intro">
    <div class="intro-marque">
      <span class="intro-m" aria-hidden="true">M</span>
      <h1 class="intro-nom">Maztrix</h1>
      <p id="intro-objectif" class="intro-objectif"></p>
    </div>
    <div class="glisser">
      <span class="glisser-texte">Glisser pour ouvrir</span>
      <button class="glisser-poignee" aria-label="Ouvrir l'app">›</button>
    </div>
  </div>

  <!-- Chrono de repos plein écran (piloté par js/timer.js) -->
  <div id="repos" class="repos" hidden>
    <p class="repos-titre">Repos <span id="repos-plage"></span></p>
    <div id="repos-temps" class="repos-temps">0:00</div>
    <p class="repos-suivant">Ensuite<br><strong id="repos-suivant"></strong></p>
    <div class="repos-actions">
      <button data-repos="-15">−15 s</button>
      <button data-repos="15">+15 s</button>
      <button data-repos="passer" class="primaire">Passer</button>
    </div>
  </div>
  <div id="flash" class="flash"></div>
</body>
</html>
