<!doctype html>
<!-- Modèle de l'icône de l'app : capturé par generer-icones.sh. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0B0B0B; }
  body { display: grid; place-items: center; }
  /* « M » condensé, blanc cassé, dans la zone sûre (iOS arrondit les coins) */
  span { font: 64vh/1 'Anton'; color: #EDEAE4; transform: scaleX(.8); }
</style>
<span>M</span>
